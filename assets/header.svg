<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Dinesh Kumar — Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a13"/><stop offset="1" stop-color="#0d1222"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#67e8f9"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0;0.3 0;-0.3 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#4f46e5" stop-opacity="0.85"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#0891b2" stop-opacity="0.8"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#9333ea" stop-opacity="0.6"/><stop offset="1" stop-color="#9333ea" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0.1"/>
    </linearGradient>
    <mask id="gridmask"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .name { font: 800 64px 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; letter-spacing: -1.5px; }
      .hi   { font: 500 20px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; fill: #8b95a7; }
      .role { font: 500 24px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; fill: #c7d2fe; }
      .pill { font: 600 14px 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; fill: #bbf7d0; }
      .code { font: 500 15px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; fill: #64748b; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <g opacity="0.8">
      <circle cx="950" cy="80" r="260" fill="url(#g1)">
        <animate attributeName="cx" values="950;1030;900;950" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="80;150;60;80" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1080" cy="260" r="220" fill="url(#g2)">
        <animate attributeName="cx" values="1080;980;1100;1080" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="760" cy="300" r="170" fill="url(#g3)">
        <animate attributeName="cy" values="300;240;300" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect width="1200" height="320" fill="url(#grid)" mask="url(#gridmask)"/>

    <!-- floating code snippet -->
    <g opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3s" repeatCount="indefinite"/>
      <rect x="830" y="92" width="290" height="136" rx="14" fill="#0b1020" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="852" cy="112" r="5" fill="#f87171"/><circle cx="870" cy="112" r="5" fill="#fbbf24"/><circle cx="888" cy="112" r="5" fill="#34d399"/>
      <text x="852" y="146" class="code"><tspan fill="#c084fc">const</tspan> <tspan fill="#e2e8f0">dev</tspan> = {</text>
      <text x="872" y="170" class="code">stack: <tspan fill="#67e8f9">"full"</tspan>,</text>
      <text x="872" y="194" class="code">ships: <tspan fill="#86efac">true</tspan>,</text>
      <text x="852" y="218" class="code">};</text>
    </g>

    <text x="80" y="104" class="hi">Hi there, I'm</text>
    <text x="78" y="176" class="name" fill="url(#name)">Dinesh Kumar</text>

    <text x="80" y="232" class="role" opacity="0">&gt; Full-Stack Developer<tspan fill="#a5b4fc">▍<animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/></tspan>
      <animate attributeName="opacity" dur="7.2s" repeatCount="indefinite"
               keyTimes="0;0.0000;0.0278;0.2222;0.2500;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="80" y="232" class="role" opacity="0">&gt; React · Next.js · TypeScript<tspan fill="#a5b4fc">▍<animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/></tspan>
      <animate attributeName="opacity" dur="7.2s" repeatCount="indefinite"
               keyTimes="0;0.2500;0.2778;0.4722;0.5000;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="80" y="232" class="role" opacity="0">&gt; Python · Django · REST APIs<tspan fill="#a5b4fc">▍<animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/></tspan>
      <animate attributeName="opacity" dur="7.2s" repeatCount="indefinite"
               keyTimes="0;0.5000;0.5278;0.7222;0.7500;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="80" y="232" class="role" opacity="0">&gt; Turning ideas into products<tspan fill="#a5b4fc">▍<animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/></tspan>
      <animate attributeName="opacity" dur="7.2s" repeatCount="indefinite"
               keyTimes="0;0.7500;0.7778;0.9722;1.0000;1" values="0;0;1;1;0;0"/>
    </text>

    <!-- status pill -->
    <rect x="80" y="258" width="196" height="32" rx="16" fill="#052e1a" stroke="#22c55e" stroke-opacity="0.45"/>
    <circle cx="100" cy="274" r="5" fill="#22c55e"/>
    <circle cx="100" cy="274" r="5" fill="none" stroke="#22c55e" stroke-width="2">
      <animate attributeName="r" values="5;12" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="114" y="279" class="pill">Available for work</text>
  </g>
</svg>
