<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-label="Shi-ning Services">
  <defs>
    <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="260">
      <stop offset="0" stop-color="#0ea5e9"/><stop offset="0.5" stop-color="#6366f1" stop-opacity="0.15"/><stop offset="1" stop-color="#6366f1"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 300 130;360 300 130" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.9">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.28"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="2" y="2" width="596" height="256" rx="18"/></clipPath>
    <style>
      .kick { font: 700 12px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; letter-spacing: 1.5px; fill: #6366f1; }
      .title { font: 700 30px 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; letter-spacing: -0.5px; }
      .desc { font: 400 16px 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; fill: #9aa4b2; }
      .tag { font: 600 12.5px 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; fill: #e2e8f0; }
    </style>
  </defs>
  <rect x="1" y="1" width="598" height="258" rx="19" fill="#0b0f19" stroke="url(#border)" stroke-width="2"/>
  <g clip-path="url(#c)">
    <rect width="600" height="260" fill="url(#glow)"/>
    <rect x="-300" y="0" width="240" height="260" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-300;900" dur="2.2s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="40" cy="47" r="4" fill="#6366f1">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="52" y="52" class="kick">CLIENT · LIVE</text>
  <text x="36" y="94" class="title" fill="url(#title)">Shi-ning Services</text>
  <text x="36" y="130" class="desc">Dynamic business website with a Django backend,</text><text x="36" y="156" class="desc">responsive UI and integrated contact forms.</text>
  <rect x="36" y="196" width="67" height="28" rx="14" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-opacity="0.35"/><text x="70" y="215" class="tag" text-anchor="middle">Django</text><rect x="111.19999999999999" y="196" width="51" height="28" rx="14" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-opacity="0.35"/><text x="137" y="215" class="tag" text-anchor="middle">HTML</text><rect x="170.0" y="196" width="43" height="28" rx="14" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-opacity="0.35"/><text x="191" y="215" class="tag" text-anchor="middle">CSS</text><rect x="220.6" y="196" width="100" height="28" rx="14" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-opacity="0.35"/><text x="271" y="215" class="tag" text-anchor="middle">JavaScript</text>
  <text x="564" y="56" text-anchor="end" font-size="22" fill="#64748b" font-family="'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif">↗
    <animateTransform attributeName="transform" type="translate" values="0 0;3 -3;0 0" dur="1.2s" repeatCount="indefinite"/>
  </text>
</svg>
